version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: avenqora-bank
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avenqora-bank"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/avenqora-bank
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      NODE_ENV: production
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIN_SYSTEM_EMAIL: ${MAIN_SYSTEM_EMAIL:-}
      MAIN_SYSTEM_EMAIL_SENDER_NAME: ${MAIN_SYSTEM_EMAIL_SENDER_NAME:-}
      CUSTOMER_SUPPORT_EMAIL: ${CUSTOMER_SUPPORT_EMAIL:-}
      CUSTOMER_SUPPORT_EMAIL_SENDER_NAME: ${CUSTOMER_SUPPORT_EMAIL_SENDER_NAME:-}
      # This matches the named uploads volume below; do not point it outside that mount.
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
